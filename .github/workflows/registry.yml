
name: "Publish the WhoAmI registry"

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: .github/workflows/gen-whoami-table.py

      - name: Generate the WhoAmI table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run .github/workflows/gen-whoami-table.py ./whoami.yml ./artifacts/docs/whoami.md

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set up .NET tools
        run: dotnet tool restore

      - name: Build documentation
        id: build-documentation
        run: dotnet docfx build docs/docfx.json

      - name: Collect documentation website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  publish-documentation:
    needs: build-documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Pages refuses a deployment while another is in progress
      group: publish-documentation
      cancel-in-progress: false
    permissions:
      # Both required by actions/deploy-pages
      pages: write
      id-token: write
    environment:
      name: documentation-website
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
