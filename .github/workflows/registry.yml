
name: "Publish the WhoAmI registry"

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Needed to find changed entries
          fetch-depth: 0

      - name: Annotate errors and warnings
        run: echo "::add-matcher::.github/workflows/problem-matcher.json"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Validate the WhoAmI registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run harp-whoami validate ./whoami.yml ./whoami.json --base origin/${{ github.base_ref || 'main' }}

      - name: Generate the WhoAmI registry module
        run: uv run harp-whoami generate

      - name: Verify pre-generated code was up-to-date
        run: |
          git add . --intent-to-add --ignore-removal
          git diff --name-status --exit-code

  build-documentation:
    needs: validate-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Annotate errors and warnings
        run: echo "::add-matcher::.github/workflows/problem-matcher.json"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Generate the WhoAmI table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --group docs .github/workflows/gen-whoami-table.py ./whoami.yml ./artifacts/docs/whoami.md

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set up .NET tools
        run: dotnet tool restore

      - name: Build documentation
        id: build-documentation
        run: dotnet docfx build docs/docfx.json

      - name: Collect documentation website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/docs/site/

  publish-documentation:
    needs: build-documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Pages refuses a deployment while another is in progress
      group: publish-documentation
      cancel-in-progress: false
    permissions:
      # Both required by actions/deploy-pages
      pages: write
      id-token: write
    environment:
      name: documentation-website
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5

  build-package:
    needs: validate-registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Annotate errors and warnings
        run: echo "::add-matcher::.github/workflows/problem-matcher.json"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Build package
        run: uv build

  enable-release:
    needs: build-package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Enable the daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT repos/${{ github.repository }}/actions/workflows/release.yml/enable
